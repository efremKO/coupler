name: XM to OpenIPC

on:
  workflow_dispatch:

# One run at a time: a run reads the release after its upload and pushes that
# list to openipc.org, and an overlapping run could push an older list last.
concurrency:
  group: xm-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: setenv
        run: |
          TAG_NAME="xiongmai"
          RELEASE_NAME="XiongMai"
          PRERELEASE=true
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
          echo "PRERELEASE=$PRERELEASE" >> $GITHUB_ENV
      - name: Install dependencies
        run: sudo apt-get update; sudo apt-get install u-boot-tools zip
      - name: Checkout
        uses: actions/checkout@v2.3.4
      - name: Fetch OpenIPC release
        run: |
          for soc in hi3516cv200 hi3516cv300 hi3516ev100 hi3516ev200 hi3516ev300 hi3518ev200 hi3518ev300 gk7201v200 gk7205v200 gk7205v300 gk7605v100 gk7205v500 xm530 xm510; do
            wget -q "https://github.com${soc}-nor-lite.tgz" || \
            wget -q "https://openipc.org${soc}-nor-lite.tgz" || \
            echo "Skip missing $soc"
          done

      - name: Create firmwares
        run: |
            export RUN="$GITHUB_WORKSPACE/.github/workflows/_xm2oipc.sh"
            export OUTPUTDIR="$GITHUB_WORKSPACE/out"
            export MANIFEST="$GITHUB_WORKSPACE/coupler-manifest.tsv"
            chmod +x $RUN

            SOC="xm530" OSMEM="35M" TOTALMEM="64M" HARDWARE="XM530_50X20-SW_8M" DEVID="00030674" FLASH_SIZE="0x800000" COMPAT="3" $RUN
            SOC="xm530" OSMEM="35M" TOTALMEM="64M" HARDWARE="XM530_50X20-WG_8M" DEVID="000309C1" FLASH_SIZE="0x800000" COMPAT="3" $RUN
            SOC="xm530" OSMEM="35M" TOTALMEM="64M" HARDWARE="XM530_50X20-WGH_8M" DEVID="0003067F" FLASH_SIZE="0x800000" COMPAT="3" $RUN
            SOC="xm530" OSMEM="35M" TOTALMEM="64M" HARDWARE="XM530_50X30-WG_8M" DEVID="00030744" FLASH_SIZE="0x800000" COMPAT="3" $RUN
            SOC="xm530" OSMEM="35M" TOTALMEM="64M" HARDWARE="XM530_50X50-WG_8M" DEVID="00030747" FLASH_SIZE="0x800000" COMPAT="3" $RUN
            SOC="xm530" OSMEM="35M" TOTALMEM="64M" HARDWARE="XM530_80X20_8M" DEVID="00030678" FLASH_SIZE="0x800000" COMPAT="3" $RUN
            SOC="xm530" OSMEM="35M" TOTALMEM="64M" HARDWARE="XM530_85X20_8M" DEVID="0003068b" FLASH_SIZE="0x800000" COMPAT="3" $RUN
            SOC="xm530" OSMEM="35M" TOTALMEM="64M" HARDWARE="XM530_85X20T_8M" DEVID="000309E5" FLASH_SIZE="0x800000" COMPAT="3" $RUN
            SOC="xm530" OSMEM="35M" TOTALMEM="64M" HARDWARE="XM530_80X30T_8M" DEVID="000309ED" FLASH_SIZE="0x800000" COMPAT="3" $RUN
            SOC="xm530" OSMEM="35M" TOTALMEM="64M" HARDWARE="XM530_R80X20-PQ_8M" DEVID="00030695" FLASH_SIZE="0x800000" COMPAT="3" $RUN
            SOC="xm530" OSMEM="35M" TOTALMEM="64M" HARDWARE="XM530_RA50X20_8M" DEVID="00030665" FLASH_SIZE="0x800000" COMPAT="3" $RUN
            
            SOC="xm530" OSMEM="86M" TOTALMEM="128M" HARDWARE="XM530_80X50_8M" DEVID="00030679" FLASH_SIZE="0x800000" COMPAT="3" $RUN
            SOC="xm530" OSMEM="86M" TOTALMEM="128M" HARDWARE="XM530_85X50_8M" DEVID="0003068D" FLASH_SIZE="0x800000" COMPAT="3" $RUN

            SOC="xm530" OSMEM="35M" TOTALMEM="64M" HARDWARE="XM530V200_X2-WQ-BL_8M" DEVID="000807D5" FLASH_SIZE="0x800000" COMPAT="3" $RUN

            SOC="xm510" TOTALMEM="32M" HARDWARE="50X10_32M" DEVID="00023650" FLASH_SIZE="0x800000" COMPAT="2" $RUN
            SOC="xm510" TOTALMEM="32M" HARDWARE="53X13_32M" DEVID="00023651" FLASH_SIZE="0x800000" COMPAT="2" $RUN


        continue-on-error: true
      - name: Upload binaries to release
        # Creates the release on the first run; on later runs overwrite: true
        # also brings its title and description back to the ones below.
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: out/*
          file_glob: true
          tag: ${{ env.TAG_NAME }}
          release_name: ${{ env.RELEASE_NAME }}
          body: |
            Transition firmware for XiongMai boards

            Instructions: https://github.com/OpenIPC/coupler#xiongmai
          prerelease: ${{ env.PRERELEASE }}
          overwrite: true
      - name: Tell openipc.org
        # Its board catalogue offers these images per device ID and marks the
        # boards they fit as supported by OpenIPC. It never polls GitHub: this
        # pushes what the release now holds (_push_openipc_org.py).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/workflows/_push_openipc_org.py "$TAG_NAME" coupler-manifest.tsv
